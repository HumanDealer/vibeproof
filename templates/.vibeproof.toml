# .vibeproof.toml — per-repo gate config. `vibeproof check` reads this.
# Generated by `vibeproof init`; edit to match THIS repo's real commands.
# A gate with no command is skipped (and reported as skipped, never silent-green).

stack = "python"          # python | node | pnpm-monorepo | unknown

[gates]
lint    = "ruff check ."
types   = "mypy ."
tests   = "pytest -q"
# secrets uses built-in gitleaks-or-regex; no command needed
# build = "pnpm build"    # optional

[branch]
protected = ["main", "master", "production"]
